# Render deployment blueprint configuration
services:
  - type: web
    name: house-of-memoir
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: admin123
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
